name: build-android-vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLAMA_TAG: b11913
      NDK_VERSION: r27c

    steps:
      - name: Checkout (wrapper toolchain)
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build \
            glslc libvulkan-dev spirv-headers python3 unzip wget

      - name: Clone llama.cpp (tag ${{ env.LLAMA_TAG }})
        run: |
          git clone --depth 1 --branch ${LLAMA_TAG} https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp && git log -1 --oneline

      # NDK ships only vulkan/vulkan.h; the Vulkan backend needs the C++
      # <vulkan/vulkan.hpp> and <spirv/unified1/spirv.hpp> (Khronos headers).
      - name: Fetch Khronos headers (Vulkan-Headers + SPIRV-Headers)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          ls Vulkan-Headers/include/vulkan/vulkan.hpp
          ls SPIRV-Headers/include/spirv/unified1/spirv.hpp

      # PATCH: per the Vulkan spec, vkGetInstanceProcAddr() returns NULL for
      # device-level entry points (vkAllocateMemory, vkMapMemory, ...). Desktop
      # loaders are lenient; the Android loader is spec-correct, so llama.cpp's
      # instance-only dispatcher init leaves those pointers NULL -> SIGSEGV on
      # the first VkDevice call. Re-init the dispatchers with vkGetDeviceProcAddr
      # right after createDevice (4-arg Vulkan-Hpp form).
      - name: Patch Vulkan device dispatcher init
        run: |
          cd llama.cpp
          python3 - <<'PYEOF'
          p = 'ggml/src/ggml-vulkan/ggml-vulkan.cpp'
          s = open(p).read()
          needle = 'device->device = device->physical_device.createDevice(device_create_info);'
          assert s.count(needle) == 1, 'needle count = %d' % s.count(needle)
          block = (
            '\n'
            '\n'
            '        // Android / spec-correct loader: vkGetInstanceProcAddr returns\n'
            '        // NULL for device-level functions. Populate device entry points\n'
            '        // via vkGetDeviceProcAddr as the Vulkan-Hpp docs require.\n'
            '        {\n'
            '            PFN_vkGetInstanceProcAddr _gipa = vkGetInstanceProcAddr;\n'
            '            PFN_vkGetDeviceProcAddr _gdpa = (PFN_vkGetDeviceProcAddr)\n'
            '                _gipa(vk_instance.instance, "vkGetDeviceProcAddr");\n'
            '            if (_gdpa != nullptr) {\n'
            '                VULKAN_HPP_DEFAULT_DISPATCHER.init(vk_instance.instance, _gipa, device->device, _gdpa);\n'
            '                ggml_vk_default_dispatcher().init(vk_instance.instance, _gipa, device->device, _gdpa);\n'
            '            }\n'
            '        }'
          )
          s = s.replace(needle, needle + block, 1)
          open(p, 'w').write(s)
          print('patched ggml-vulkan.cpp')
          PYEOF
          grep -n -A12 'Android / spec-correct loader' ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Download Android NDK ${{ env.NDK_VERSION }}
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure (Android arm64 + Vulkan)
        run: |
          KHDR="-I$GITHUB_WORKSPACE/Vulkan-Headers/include -I$GITHUB_WORKSPACE/SPIRV-Headers/include"
          cd llama.cpp
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/android-vulkan-toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$KHDR" \
            -DCMAKE_CXX_FLAGS="$KHDR" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_VULKAN=ON \
            -DVulkan_INCLUDE_DIR=$GITHUB_WORKSPACE/Vulkan-Headers/include \
            -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build
        run: cmake --build llama.cpp/build-android -j$(nproc)

      - name: List built files
        run: ls -la llama.cpp/build-android/bin

      - name: Package
        run: |
          set -e
          mkdir -p dist
          cp -a llama.cpp/build-android/bin/. dist/
          cd dist
          for f in lib*.so.*; do
            [ -e "$f" ] || continue
            base="${f%%.so.*}.so"
            if [ ! -e "$base" ]; then cp -a "$f" "$base"; fi
          done
          cd "$GITHUB_WORKSPACE"
          tar czf llama-android-arm64-vulkan.tar.gz -C dist .
          ls -la llama-android-arm64-vulkan.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64-vulkan
          path: llama-android-arm64-vulkan.tar.gz
          retention-days: 30
