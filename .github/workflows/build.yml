name: build-android-vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLAMA_TAG: b11913
      NDK_VERSION: r27c

    steps:
      - name: Checkout (wrapper toolchain)
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build \
            glslc libvulkan-dev spirv-headers python3 unzip wget

      - name: Clone llama.cpp (tag ${{ env.LLAMA_TAG }})
        run: |
          git clone --depth 1 --branch ${LLAMA_TAG} https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp && git log -1 --oneline

      - name: Fetch Khronos headers (Vulkan-Headers + SPIRV-Headers)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git

      - name: Patch ggml-vulkan (Mali driver workarounds)
        run: |
          cd llama.cpp
          python3 - <<'PYEOF'
          p = 'ggml/src/ggml-vulkan/ggml-vulkan.cpp'
          s = open(p).read()

          # Patch A: device-level dispatcher init.
          # Per spec, vkGetInstanceProcAddr returns NULL for device-level fns;
          # Android loader is spec-correct so llama.cpp's instance-only init
          # leaves them NULL. Re-init dispatchers with vkGetDeviceProcAddr.
          needle = 'device->device = device->physical_device.createDevice(device_create_info);'
          assert s.count(needle) == 1, 'A needle count = %d' % s.count(needle)
          block = (
            '\n'
            '\n'
            '        // device-level dispatcher init (spec-correct loaders)\n'
            '        {\n'
            '            PFN_vkGetInstanceProcAddr _gipa = vkGetInstanceProcAddr;\n'
            '            PFN_vkGetDeviceProcAddr _gdpa = (PFN_vkGetDeviceProcAddr)\n'
            '                _gipa(vk_instance.instance, "vkGetDeviceProcAddr");\n'
            '            if (_gdpa != nullptr) {\n'
            '                VULKAN_HPP_DEFAULT_DISPATCHER.init(vk_instance.instance, _gipa, device->device, _gdpa);\n'
            '                ggml_vk_default_dispatcher().init(vk_instance.instance, _gipa, device->device, _gdpa);\n'
            '            }\n'
            '        }'
          )
          s = s.replace(needle, needle + block, 1)

          # Patch B: Mali (MT6893) advertises VkPhysicalDeviceVulkan12Features.
          # bufferDeviceAddress = true but does not return a vkGetBufferDeviceAddress
          # entry point -> NULL call -> SIGSEGV. Disable BDA unless the fn exists.
          needle2 = 'device->buffer_device_address = vk12_features.bufferDeviceAddress;'
          assert s.count(needle2) == 1, 'B needle count = %d' % s.count(needle2)
          repl2 = (
            'device->buffer_device_address = vk12_features.bufferDeviceAddress\n'
            '            && VULKAN_HPP_DEFAULT_DISPATCHER.vkGetBufferDeviceAddress != nullptr\n'
            '            && ggml_vk_default_dispatcher().vkGetBufferDeviceAddress != nullptr\n'
            '            && getenv("GGML_VK_DISABLE_BUFFER_DEVICE_ADDRESS") == nullptr;'
          )
          s = s.replace(needle2, repl2, 1)
          open(p, 'w').write(s)
          print('patched ggml-vulkan.cpp (A+B)')
          PYEOF
          grep -n -B1 -A6 'buffer_device_address = vk12_features' ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Download Android NDK ${{ env.NDK_VERSION }}
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure (Android arm64 + Vulkan)
        run: |
          KHDR="-I$GITHUB_WORKSPACE/Vulkan-Headers/include -I$GITHUB_WORKSPACE/SPIRV-Headers/include"
          cd llama.cpp
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/android-vulkan-toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$KHDR" \
            -DCMAKE_CXX_FLAGS="$KHDR" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_VULKAN=ON \
            -DVulkan_INCLUDE_DIR=$GITHUB_WORKSPACE/Vulkan-Headers/include \
            -DGGML_OPENMP=OFF \
            -DGGML_BACKEND_DL=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build
        run: cmake --build llama.cpp/build-android -j$(nproc)

      - name: Package
        run: |
          set -e
          mkdir -p dist
          cp -a llama.cpp/build-android/bin/. dist/
          cd dist
          for f in lib*.so.*; do
            [ -e "$f" ] || continue
            base="${f%%.so.*}.so"
            if [ ! -e "$base" ]; then cp -a "$f" "$base"; fi
          done
          cd "$GITHUB_WORKSPACE"
          tar czf llama-android-arm64-vulkan.tar.gz -C dist .
          ls -la llama-android-arm64-vulkan.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64-vulkan
          path: llama-android-arm64-vulkan.tar.gz
          retention-days: 30
