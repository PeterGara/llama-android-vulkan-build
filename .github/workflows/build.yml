name: build-android-vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLAMA_TAG: b11913
      NDK_VERSION: r27c

    steps:
      - name: Checkout (wrapper toolchain)
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build \
            glslc libvulkan-dev spirv-headers python3 unzip wget

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch ${LLAMA_TAG} https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp && git log -1 --oneline

      - name: Fetch Khronos headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git

      - name: Patch ggml-vulkan (upstream PR 28593, adapted to b11913)
        run: |
          cd llama.cpp
          python3 - <<'PYEOF'
          p = 'ggml/src/ggml-vulkan/ggml-vulkan.cpp'
          s = open(p).read()

          # 1) Enable the KHR extensions that back core-1.2 features on pre-1.2 drivers.
          #    Without this, vkGetBufferDeviceAddress / vkSignalSemaphore resolve to NULL.
          old1 = '        device->vulkan_memory_model = vk12_features.vulkanMemoryModel;\n'
          assert s.count(old1) == 1, 'old1 %d' % s.count(old1)
          add1 = (
            '        // pre-1.2 driver: enable the KHR extensions that back these core-1.2\n'
            '        // features, otherwise the device entry points resolve to NULL. Upstream #28593.\n'
            '        if (device->buffer_device_address && device->properties.apiVersion < VK_API_VERSION_1_2) {\n'
            '            device_extensions.push_back("VK_KHR_buffer_device_address");\n'
            '        }\n'
            '        if (vk12_features.timelineSemaphore && device->properties.apiVersion < VK_API_VERSION_1_2) {\n'
            '            device_extensions.push_back("VK_KHR_timeline_semaphore");\n'
            '        }\n'
          )
          s = s.replace(old1, old1 + add1, 1)

          # 2) VK_KHR_16bit_storage is core since 1.1; only request it below 1.1.
          old2 = '        device_extensions.push_back("VK_KHR_16bit_storage");'
          assert s.count(old2) == 1, 'old2 %d' % s.count(old2)
          new2 = (
            '        // Core since 1.1; some drivers stop listing it as an extension past that point.\n'
            '        if (device->properties.apiVersion < VK_API_VERSION_1_1) {\n'
            '            device_extensions.push_back("VK_KHR_16bit_storage");\n'
            '        }'
          )
          s = s.replace(old2, new2, 1)

          # 3) Re-init the default dispatcher with the device (Vulkan-Hpp docs).
          old3 = '        device->device = device->physical_device.createDevice(device_create_info);'
          assert s.count(old3) == 1, 'old3 %d' % s.count(old3)
          add3 = (
            old3 + '\n'
            '\n'
            '        // Only ever init()\'d against the instance; some ICDs do not resolve\n'
            '        // device-level / device-extension functions through the instance trampoline.\n'
            '        VULKAN_HPP_DEFAULT_DISPATCHER.init(device->device);'
          )
          s = s.replace(old3, add3, 1)

          open(p, 'w').write(s)
          print('patched OK')
          PYEOF
          echo '--- verify ---'
          grep -n 'VK_KHR_timeline_semaphore\|VK_KHR_buffer_device_address\|VULKAN_HPP_DEFAULT_DISPATCHER.init(device->device)\|apiVersion < VK_API_VERSION_1_1' ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure
        run: |
          KHDR="-I$GITHUB_WORKSPACE/Vulkan-Headers/include -I$GITHUB_WORKSPACE/SPIRV-Headers/include"
          cd llama.cpp
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/android-vulkan-toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$KHDR" -DCMAKE_CXX_FLAGS="$KHDR" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DGGML_VULKAN=ON -DVulkan_INCLUDE_DIR=$GITHUB_WORKSPACE/Vulkan-Headers/include \
            -DGGML_OPENMP=OFF -DGGML_BACKEND_DL=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=ON

      - name: Build
        run: cmake --build llama.cpp/build-android -j$(nproc)

      - name: Package
        run: |
          set -e
          mkdir -p dist && cp -a llama.cpp/build-android/bin/. dist/
          cd dist
          for f in lib*.so.*; do [ -e "$f" ] || continue; base="${f%%.so.*}.so"; [ -e "$base" ] || cp -a "$f" "$base"; done
          cd "$GITHUB_WORKSPACE"
          tar czf llama-android-arm64-vulkan.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64-vulkan
          path: llama-android-arm64-vulkan.tar.gz
          retention-days: 30
